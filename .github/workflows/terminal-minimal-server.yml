name: Minimal serving runtime

on:
  push:
    paths:
      - .github/workflows/terminal-minimal-server.yml
      - terminal/requirements.txt
      - terminal/strata.py
      - terminal/strata_cli/**
      - terminal/strata_control/**
      - terminal/serve/**
      - terminal/tests/terminal/test_runtime.py
      - terminal/tools/minimal_server_smoke.py
      - terminal/tools/strata_tokenizer.py
  pull_request:
    paths:
      - .github/workflows/terminal-minimal-server.yml
      - terminal/requirements.txt
      - terminal/strata.py
      - terminal/strata_cli/**
      - terminal/strata_control/**
      - terminal/serve/**
      - terminal/tests/terminal/test_runtime.py
      - terminal/tools/minimal_server_smoke.py
      - terminal/tools/strata_tokenizer.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-engine:
    name: Linux / runtime requirements only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install only pinned runtime requirements
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/strata-runtime-venv"
          "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m pip install -r terminal/requirements.txt
      - name: Check fake-engine serving without terminal packages
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / 'minimal-server-smoke.json'
          python = str(Path(os.environ['RUNNER_TEMP']) / 'strata-runtime-venv' / 'bin' / 'python')
          subprocess.run([python, 'terminal/tools/minimal_server_smoke.py',
                          '--report', str(report)], check=True)
          print(report.read_text())
          PY
      - name: Run full server suite without terminal packages
        shell: bash
        env:
          # fork: discovery loads these test files as BARE top-level modules (top_level = the start dir), and all but one
          # carry their own sys.path bootstrap of terminal/; the first-imported one alphabetically (test_abort_sync) does
          # not, so its `from serve import ...` dies until a sibling has run. terminal/ on PYTHONPATH makes serve resolvable
          # from the very first import - the same effect as every sibling's own bootstrap. (Red on the 0.2.16 and 0.2.17 merges.)
          PYTHONPATH: terminal
        run: |
          "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m unittest discover -s terminal/serve -p 'test_*.py'

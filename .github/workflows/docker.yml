name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: haasanen/strata

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the upstream sync merge needs a common ancestor,
          # which a shallow (depth=1) clone cannot provide — git then
          # refuses with "unrelated histories" even when they are related.
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        if: github.event_name != 'push'
        run: |
          git remote add upstream https://github.com/Niko1221/Strata.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git config user.email "hermes@simo.dev"
          git config user.name "Hermes Agent"
          if ! git merge --no-edit upstream/main; then
            if git merge-base HEAD upstream/main >/dev/null 2>&1; then
              echo "::error::upstream merge hit real conflicts — resolve manually"
            else
              echo "::error::upstream rewrote its history (no common ancestor) — re-anchor the fork onto upstream/main and force-push"
            fi
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: no new commits"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git log --oneline "$before".."$after" | head -20
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=89

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: haasanen/strata

# Two pushes in quick succession must not race on the -h<N> counter: each build
# reads the highest published tag at its START, so parallel builds both pick the
# same N and the second overwrites the first's tag (seen 2026-10-07: two builds
# both tagged 0.1.40.3-h3). Serialize: the second build starts after the first
# publishes, so its counter read sees the new tag.
concurrency:
  group: strata-build-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the upstream sync merge needs a common ancestor,
          # which a shallow (depth=1) clone cannot provide — git then
          # refuses with "unrelated histories" even when they are related.
          fetch-depth: 0
          fetch-tags: true

      - name: Sync with upstream (released versions only)
        id: sync
        if: github.event_name != 'push'
        run: |
          # Merge only what upstream has RELEASED: the commit their latest
          # GitHub release points at, never the moving main branch. A new
          # release appearing is the only thing that triggers a merge;
          # unreleased main commits wait until upstream ships them.
          git remote add upstream https://github.com/Niko1221/Strata.git
          REL=$(curl -s "https://api.github.com/repos/Niko1221/Strata/releases/latest" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          test -n "$REL" || { echo "::error::could not read the latest upstream release"; exit 1; }
          echo "latest upstream release: $REL"
          git fetch upstream "refs/tags/${REL}:refs/tags/${REL}"
          if git merge-base --is-ancestor "${REL}^{commit}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: no new release (fork already contains $REL)"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          git config user.email "hermes@simo.dev"
          git config user.name "Hermes Agent"
          if ! git merge --no-edit "${REL}^{commit}"; then
            if git merge-base HEAD "${REL}^{commit}" >/dev/null 2>&1; then
              echo "::error::merging release $REL hit real conflicts — resolve manually"
            else
              echo "::error::upstream rewrote its history (no common ancestor) — re-anchor the fork onto upstream/main and force-push"
            fi
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: nothing new in $REL"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "release_note=$REL" >> "$GITHUB_OUTPUT"
            git log --oneline "$before".."$after" | head -20
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute fork version tag
        id: forkver
        run: |
          # Tag images with the upstream Strata version plus our fork build
          # number: <upstream>-h<N> (e.g. 0.1.40.1-h1) — the same convention
          # as the Proton fork. The upstream version comes from the latest
          # upstream GitHub release (the authoritative version; hotfix
          # releases like 0.1.40.1 do not bump CMakeLists.txt). N is 1 +
          # the highest -h<N> already published for that upstream version,
          # read from the ghcr tag list, so it increments on every build.
          UPSTREAM=$(curl -s "https://api.github.com/repos/Niko1221/Strata/releases/latest" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          test -n "$UPSTREAM" || { echo "::error::could not read upstream release version"; exit 1; }
          TOK=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          LAST=$(curl -s -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" | UP="$UPSTREAM" python3 -c "
          import json,os,re,sys
          tags=json.load(sys.stdin).get('tags') or []
          pat=re.compile('^'+re.escape(os.environ['UP'])+r'-h([0-9]+)$')
          ns=[int(m.group(1)) for t in tags if (m:=pat.match(t))]
          print(max(ns) if ns else 0)")
          N=$((LAST + 1))
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM-h$N" >> "$GITHUB_OUTPUT"
          echo "fork version: $UPSTREAM-h$N (highest published for $UPSTREAM: ${LAST:-none})"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.forkver.outputs.tag }}
            type=raw,value=${{ steps.forkver.outputs.upstream }}

      - name: Build and push Docker image
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=89

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: haasanen/strata

# Two pushes in quick succession must not race on the -h<N> counter: each build
# reads the highest published tag at its START, so parallel builds both pick the
# same N and the second overwrites the first's tag (seen 2026-10-07: two builds
# both tagged 0.1.40.3-h3). Serialize: the second build starts after the first
# publishes, so its counter read sees the new tag.
concurrency:
  group: strata-build-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          # Full history: the upstream sync merge needs a common ancestor,
          # which a shallow (depth=1) clone cannot provide — git then
          # refuses with "unrelated histories" even when they are related.
          fetch-depth: 0
          fetch-tags: true

      - name: Sync with upstream (released versions only)
        id: sync
        if: github.event_name != 'push'
        run: |
          # Merge only what upstream has RELEASED: the commit their latest
          # GitHub release points at, never the moving main branch. A new
          # release appearing is the only thing that triggers a merge;
          # unreleased main commits wait until upstream ships them.
          git remote add upstream https://github.com/Niko1221/Strata.git
          # The anonymous read shares the runner IP's 60/h quota and died on its
          # rate-limit body twice (2026-11-22 sync step, 2026-11-23 forkver step):
          # read authenticated with this step's FORK_PAT, retry, and on failure
          # print the HTTP status/body so a dead quota cannot look like a mystery.
          reljson=/tmp/strata-latest-release.json
          rel_read=
          for i in 1 2 3; do
            code=$(curl -sS -o "$reljson" -w '%{http_code}' -H "Authorization: Bearer ${FORK_PAT}" "https://api.github.com/repos/Niko1221/Strata/releases/latest") || code=curlfail
            if [ "$code" = 200 ] && REL=$(python3 -c "import json;print(json.load(open('$reljson'))['tag_name'])" 2>/dev/null) && [ -n "${REL:-}" ]; then rel_read=1; break; fi
            echo "releases/latest attempt $i: HTTP $code body $(head -c 150 "$reljson" 2>/dev/null)" >&2
            sleep 20
          done
          test -n "$rel_read" || { echo "::error::could not read the latest upstream release (3 attempts; the status/body of each is above)"; exit 1; }
          echo "latest upstream release: $REL"
          git fetch upstream "refs/tags/${REL}:refs/tags/${REL}"
          if git merge-base --is-ancestor "${REL}^{commit}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: no new release (fork already contains $REL)"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          git config user.email "hermes@simo.dev"
          git config user.name "Hermes Agent"
          if ! git merge --no-edit "${REL}^{commit}"; then
            if git merge-base HEAD "${REL}^{commit}" >/dev/null 2>&1; then
              echo "::error::merging release $REL hit real conflicts — resolve manually"
            else
              echo "::error::upstream rewrote its history (no common ancestor) — re-anchor the fork onto upstream/main and force-push"
            fi
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: nothing new in $REL"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "release_note=$REL" >> "$GITHUB_OUTPUT"
            git log --oneline "$before"..HEAD | head -20
            # push with the PAT, not GITHUB_TOKEN: a merge often carries upstream's
            # .github/workflows changes, and the runner's App token may not write those
            git config --local --unset-all 'http.https://github.com/.extraheader' || true
            # basic x-access-token form: the form proven to work for this fork (the
            # bearer form got 401 on the runner: "could not read Username")
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORK_PAT" | base64 -w0)"
            git push origin HEAD:main
            git config --local --unset-all 'http.https://github.com/.extraheader' || true
          fi
        env:
          FORK_PAT: ${{ secrets.FORK_PAT }}

      - name: Fork contract tests (fail-red gate)
        run: |
          # 2026-10-29: one wrongly split /switch target ("abliterated-IQ3_S" as one word) went
          # into active_model blind and crash-looped the running container 12 times on the NAS.
          # These tests pin the switch contract and the process-identity fixes; an upstream sync
          # that breaks a fork patch must fail HERE, before the image is pushed, not on the NAS.
          # 0.2.16 moved the Terminal app under terminal/; the test module now lives there.
          cd terminal && python3 -m unittest -v tests.terminal.test_fork_serving_contract

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute fork version tag
        id: forkver
        env:
          FORK_PAT: ${{ secrets.FORK_PAT }}
        run: |
          # Tag images with the upstream Strata version plus our fork build
          # number: <upstream>-h<N> (e.g. 0.1.40.1-h1) — the same convention
          # as the Proton fork. The upstream version comes from the latest
          # upstream GitHub release (the authoritative version; hotfix
          # releases like 0.1.40.1 do not bump CMakeLists.txt). N is 1 +
          # the highest -h<N> already published for that upstream version,
          # read from the ghcr tag list, so it increments on every build.
          # Same authenticated + retry + status/body pattern as the sync step: the
          # bare anonymous curl died on a rate-limit body here on 2026-11-23 (run
          # 45111476430), exactly as it had in the sync step on 2026-11-22.
          reljson=/tmp/strata-latest-release.json
          ver_read=
          for i in 1 2 3; do
            code=$(curl -sS -o "$reljson" -w '%{http_code}' -H "Authorization: Bearer ${FORK_PAT}" "https://api.github.com/repos/Niko1221/Strata/releases/latest") || code=curlfail
            if [ "$code" = 200 ] && UPSTREAM=$(python3 -c "import json;print(json.load(open('$reljson'))['tag_name'].lstrip('v'))" 2>/dev/null) && [ -n "${UPSTREAM:-}" ]; then ver_read=1; break; fi
            echo "releases/latest attempt $i: HTTP $code body $(head -c 150 "$reljson" 2>/dev/null)" >&2
            sleep 20
          done
          test -n "$ver_read" || { echo "::error::could not read upstream release version (3 attempts; the status/body of each is above)"; exit 1; }
          # Paginate the tag list: ghcr caps tags/list at ~100 entries and its Link rel=next
          # URLs are RELATIVE. A single unpaged read sees only the OLDEST 100 tags, so once the
          # package crosses 100 tags (2026-11-19: 143) the -h<N> counter reads zero for the
          # current upstream version and a rebuild silently CLOBBERS h1 instead of publishing h2.
          LAST=$(UPSTREAM="$UPSTREAM" IMAGE_NAME="$IMAGE_NAME" python3 - <<'PY'
          import json, os, re, urllib.request
          up, img = os.environ["UPSTREAM"], os.environ["IMAGE_NAME"]
          tok = json.load(urllib.request.urlopen(f"https://ghcr.io/token?scope=repository:{img}:pull&service=ghcr.io", timeout=30))["token"]
          pat = re.compile("^" + re.escape(up) + r"-h([0-9]+)$")
          ns, url = [], f"https://ghcr.io/v2/{img}/tags/list?n=100"
          while url:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  ns += [int(m.group(1)) for t in (json.load(r).get("tags") or []) if (m := pat.match(t))]
                  link = r.headers.get("Link") or ""
              url = None
              for part in link.split(","):
                  if 'rel="next"' in part:
                      nxt = part[part.find("<") + 1:part.find(">")]
                      url = nxt if nxt.startswith("http") else "https://ghcr.io" + nxt
          print(max(ns) if ns else 0)
          PY
          )
          N=$((LAST + 1))
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM-h$N" >> "$GITHUB_OUTPUT"
          echo "fork version: $UPSTREAM-h$N (highest published for $UPSTREAM: ${LAST:-none})"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.forkver.outputs.tag }}
            type=raw,value=${{ steps.forkver.outputs.upstream }}

      - name: Build and push Docker image
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v5.4.0
        with:
          context: .
          # 0.2.16 moved the from-source Dockerfile out of the repo root; without this
          # the build would look for a root Dockerfile that no longer exists.
          file: tools/docker/Dockerfile.src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=89
            STRATA_COMMIT=${{ github.sha }}

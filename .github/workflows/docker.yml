name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: haasanen/strata

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the upstream sync merge needs a common ancestor,
          # which a shallow (depth=1) clone cannot provide — git then
          # refuses with "unrelated histories" even when they are related.
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        if: github.event_name != 'push'
        run: |
          git remote add upstream https://github.com/Niko1221/Strata.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git config user.email "hermes@simo.dev"
          git config user.name "Hermes Agent"
          if ! git merge --no-edit upstream/main; then
            if git merge-base HEAD upstream/main >/dev/null 2>&1; then
              echo "::error::upstream merge hit real conflicts — resolve manually"
            else
              echo "::error::upstream rewrote its history (no common ancestor) — re-anchor the fork onto upstream/main and force-push"
            fi
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream: no new commits"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git log --oneline "$before".."$after" | head -20
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute fork version tag
        id: forkver
        run: |
          # Tag images with the upstream Strata version plus our fork build
          # number: <upstream>-h<N> (h = haasanen), e.g. 0.1.40-h1 — the
          # same convention as the Proton fork. The upstream version comes
          # from CMakeLists.txt (the engine's own project VERSION). N is 1 +
          # the highest -h<N> already published for that upstream version,
          # read from the ghcr tag list, so it increments on every build.
          UPSTREAM=$(grep -oE 'project\(strata VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          test -n "$UPSTREAM" || { echo "::error::could not read upstream version from CMakeLists.txt"; exit 1; }
          TOK=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          LAST=$(curl -s -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" | UP="$UPSTREAM" python3 -c "
          import json,os,re,sys
          tags=json.load(sys.stdin).get('tags') or []
          pat=re.compile('^'+re.escape(os.environ['UP'])+r'-h([0-9]+)$')
          ns=[int(m.group(1)) for t in tags if (m:=pat.match(t))]
          print(max(ns) if ns else 0)")
          N=$((LAST + 1))
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM-h$N" >> "$GITHUB_OUTPUT"
          echo "fork version: $UPSTREAM-h$N (highest published for $UPSTREAM: ${LAST:-none})"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.forkver.outputs.tag }}
            type=raw,value=${{ steps.forkver.outputs.upstream }}

      - name: Build and push Docker image
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=89
